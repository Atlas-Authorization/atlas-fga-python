name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy: { matrix: { python: ['3.9', '3.12'] } }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ matrix.python }}' }
      - run: pip install -e '.[dev]'
      - run: pytest
